name: Deploy Identity Navigator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Select the GitHub Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$repository_name" >> "$GITHUB_ENV"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install exact dependencies
        run: npm ci

      - name: Check source
        run: |
          npm run lint
          npm run typecheck

      # Verify protected files, build the export, and run every test suite.
      - name: Run the release gate and build the static export
        run: npm test

      - name: Verify deployable files
        shell: bash
        run: |
          test -f out/index.html
          test -f out/sw.js
          test -f out/.nojekyll
          test -f out/manifest.webmanifest
          test -f out/forms/oregon/2026-07/adult-name-sex-change-packet.pdf
          test -f out/forms/oregon/fee-waiver/2026-01/fee-deferral-waiver-packet.pdf
          test -f out/forms/washington/king/fee-waiver/2025-10/motion-and-financial-statement.pdf

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
